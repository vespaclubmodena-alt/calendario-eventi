
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vespa Club Modena 1949 - Eventi 2027</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172b4d;
  margin: 0;
  padding: 16px;
}
main {
  max-width: 1000px;
  margin: auto;
  background: white;
  padding: 18px;
  border-radius: 16px;
}
h1, p { text-align: center; }
nav { display: flex; gap: 10px; margin: 20px 0; }
button {
  flex: 1;
  padding: 16px;
  border: 0;
  border-radius: 10px;
  background: #e5ebf3;
  font-size: 16px;
  cursor: pointer;
}
button.active { background: #172b4d; color: white; }
iframe { width: 100%; height: 650px; border: 0; }
a { color: #172b4d; }
</style>
</head>
<body>
<main>
<h1>Vespa Club Modena 1949</h1>
<p>Calendario eventi 2027</p>

<nav>
<button id="listBtn" class="active" onclick="show('AGENDA')">
Elenco eventi
</button>
<button id="monthBtn" onclick="show('MONTH')">
Vista mensile
</button>
</nav>

<iframe id="calendar" title="Calendario eventi"></iframe>

<h2>Ricevi gli aggiornamenti</h2>
<p>
<a id="google" target="_blank" rel="noopener">
Aggiungi a Google Calendar
</a>
</p>
<p>
<a id="apple">
Iscriviti con Apple Calendar
</a>
</p>
<p>
Per Outlook, usa la funzione
"Aggiungi calendario → Sottoscrivi dal Web"
e inserisci l'indirizzo pubblico iCal.
</p>
</main>

<script>
const id =
"2f2bc429c287adfd07dd6ba1e1df5735fa0c84b0376926243776fddb9326095d@group.calendar.google.com";

const ical =
"https://calendar.google.com/calendar/ical/" +
encodeURIComponent(id) + "/public/basic.ics";

document.getElementById("google").href =
"https://calendar.google.com/calendar/render?cid=" +
encodeURIComponent(id);

document.getElementById("apple").href =
"webcal://calendar.google.com/calendar/ical/" +
encodeURIComponent(id) + "/public/basic.ics";

function show(mode) {
  const url = new URL(
    "https://calendar.google.com/calendar/embed"
  );
  url.searchParams.set("src", id);
  url.searchParams.set("ctz", "Europe/Rome");
  url.searchParams.set("mode", mode);
  url.searchParams.set("showTitle", "0");
  url.searchParams.set("showCalendars", "0");
  url.searchParams.set("showTabs", "0");

  document.getElementById("calendar").src = url.href;
  document.getElementById("listBtn").classList.toggle(
    "active", mode === "AGENDA"
  );
  document.getElementById("monthBtn").classList.toggle(
    "active", mode === "MONTH"
  );
}

show("AGENDA");
</script>
</body>
</html>
